name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.os }}/${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            os: darwin
            arch: arm64
            ext: dylib
          - runner: macos-latest
            os: darwin
            arch: amd64
            ext: dylib
          - runner: ubuntu-latest
            os: linux
            arch: amd64
            ext: so
          - runner: ubuntu-latest
            os: linux
            arch: arm64
            ext: so
            cc: aarch64-linux-gnu-gcc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: Install cross toolchain
        if: matrix.cc != ''
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu
      - name: Build
        env:
          CGO_ENABLED: "1"
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          CC: ${{ matrix.cc }}
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          go build -buildvcs=false -trimpath -buildmode=c-shared \
            -ldflags "-s -w -X main.version=$VERSION" \
            -o "codex-quota-guard-v${VERSION}-${GOOS}-${GOARCH}.${{ matrix.ext }}" .
          rm -f "codex-quota-guard-v${VERSION}-${GOOS}-${GOARCH}.h" || true
      - uses: actions/upload-artifact@v4
        with:
          name: codex-quota-guard-${{ matrix.os }}-${{ matrix.arch }}
          path: codex-quota-guard-v*-${{ matrix.os }}-${{ matrix.arch }}.${{ matrix.ext }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
